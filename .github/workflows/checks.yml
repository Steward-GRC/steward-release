name: checks
# The ruleset on main requires `checks / Build & Test`, `dco / DCO` and
# `secrets / Secrets`, so the job ids stay `checks`, `dco` and `secrets`. This
# repo has no go.mod or package.json (a Helm-chart-only repo; the hub has no
# chart ecosystem yet, a gap filed upstream), so `checks` runs Helm
# lint/template plus a pinned, checksum-checked kubeconform validation
# in-line instead of calling the org's go.yml. `dco` and `secrets` are
# unchanged. There are no other services' protos to pin, so proto-sync does
# not apply here. `kind` installs the chart on a kind cluster with the
# service images built from ci/kind/images.txt (job-kind.yaml).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "23 10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && github.event.pull_request.draft != true
    permissions:
      contents: read
    uses: ./.github/workflows/job-helm.yaml
  # The Go tool (steward-migrate). Not a required check: the required context
  # stays `checks / Build & Test`, the Helm job above.
  go:
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && github.event.pull_request.draft != true
    permissions:
      contents: read
    uses: Steward-GRC/.github/.github/workflows/go.yml@main
    with:
      timeout-minutes: 15
  kind:
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && github.event.pull_request.draft != true
    permissions:
      contents: read
    uses: ./.github/workflows/job-kind.yaml
  # Self-tests the pin checker on pull requests; on the weekday schedule (and
  # a manual run) fails when ci/kind/images.txt is behind the services' main.
  pins:
    if: github.event_name != 'push' && github.event.pull_request.draft != true
    permissions:
      contents: read
    uses: ./.github/workflows/job-pins.yaml
  dco:
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && github.event.pull_request.draft != true
    uses: Steward-GRC/.github/.github/workflows/dco.yml@main
  secrets:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && github.event.pull_request.draft != true
    permissions:
      contents: read
    uses: Steward-GRC/.github/.github/workflows/secrets.yml@main
