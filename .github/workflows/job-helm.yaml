name: helm
# Called by checks.yml as the `checks` job, so the status context is
# `checks / Build & Test`, the name the main ruleset requires.
on:
  workflow_call:
permissions:
  contents: read
env:
  HELM_VERSION: v3.16.3
  HELM_SHA256: f5355c79190951eed23c5432a3b920e071f4c00a64f75e077de0dd4cb7b294ea
  KUBECONFORM_VERSION: v0.6.7
  KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Helm (pinned, checksum-checked)
        run: |
          set -euo pipefail
          curl -fsSL -o helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
          helm version
      - name: Install kubeconform (pinned, checksum-checked)
        run: |
          set -euo pipefail
          curl -fsSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
          kubeconform -v
      - name: helm lint (the reusable service chart)
        run: helm lint charts/_service
      - name: helm lint (umbrella)
        # The umbrella (Chart.yaml at the repo root) lands in a later PR of
        # the port; a PR that carries only the reusable chart has none yet.
        if: hashFiles('Chart.yaml') != ''
        run: helm lint . -f values.yaml
      - name: helm dependency build
        id: deps
        if: hashFiles('Chart.yaml') != ''
        # Bugs5382/helm-postgres-ha has no published chart yet, so this step
        # fails until it ships; the fallback below keeps every service
        # rendered and validated in the bring-your-own Postgres shape.
        continue-on-error: true
        run: helm dependency build .
      - name: Prepare the umbrella without postgres-ha (fallback)
        if: hashFiles('Chart.yaml') != '' && steps.deps.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::helm-postgres-ha is not published; rendering the bring-your-own Postgres shape only"
          mkdir -p /tmp/umbrella
          cp -r Chart.yaml values*.yaml charts /tmp/umbrella/
          yq -i 'del(.dependencies[] | select(.name == "postgres-ha"))' /tmp/umbrella/Chart.yaml
          helm dependency build /tmp/umbrella
          echo "CHART_DIR=/tmp/umbrella" >> "$GITHUB_ENV"
          echo "EXTRA_VALUES=-f /tmp/umbrella/values-byo-postgres-example.yaml" >> "$GITHUB_ENV"
      - name: helm template (defaults)
        if: hashFiles('Chart.yaml') != ''
        run: helm template steward "${CHART_DIR:-.}" -f values.yaml ${EXTRA_VALUES:-} --namespace steward > /tmp/rendered-default.yaml
      - name: helm template (high availability example)
        if: hashFiles('values-ha-example.yaml') != ''
        run: helm template steward "${CHART_DIR:-.}" -f values.yaml -f values-ha-example.yaml ${EXTRA_VALUES:-} --namespace steward > /tmp/rendered-ha.yaml
      - name: kubeconform (defaults)
        if: hashFiles('Chart.yaml') != ''
        run: kubeconform -strict -summary -kubernetes-version 1.29.0 /tmp/rendered-default.yaml
      - name: kubeconform (high availability example)
        if: hashFiles('values-ha-example.yaml') != ''
        run: kubeconform -strict -summary -kubernetes-version 1.29.0 /tmp/rendered-ha.yaml
