{{- /*
identity writes each OIDC client secret an admin enters, and each client
secret Polis issues, as a key of this Secret; the database only names the key.
It ships empty and without a data field, so an upgrade never touches the keys
identity wrote, and helm keeps it on uninstall.
*/ -}}
{{- if and .Values.identity.enabled .Values.identityPolisSecrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.identityPolisSecrets.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: steward-identity
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- end }}
