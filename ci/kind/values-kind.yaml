# The kind install test's values (ci/kind/run.sh), layered on values.yaml.
# Generated values live in Secrets run.sh creates; nothing here is a real
# credential.
#
# - Bring-your-own Postgres: one pgvector instance (ci/kind/deps.yaml) with a
#   database and role per service, steward_<alias>/<alias>.
# - The chart sets DATABASE_DSN, PGPASSWORD and GRPC_PORT from the values
#   below; each service's other settings (the addresses of the services it
#   calls, its keys) come in through `env`.
# - opaBundle is off: no service reads OPA_BUNDLE_PATH; each builds the
#   steward-authz bundle into its own image.
# - Images: run.sh sets <alias>.image.repository/tag from ci/kind/images.txt.
identity:
  logging:
    level: debug
  postgres:
    external:
      enabled: true
      host: steward-postgres
      port: 5432
      database: steward_identity
      user: identity
      sslmode: disable
      passwordSecretName: steward-ci-env
      passwordSecretKey: identity-password
  env:
  - name: RABBITMQ_URL
    valueFrom:
      secretKeyRef:
        name: steward-ci-env
        key: rabbitmq-url
  - name: KRATOS_ADMIN_URL
    value: http://steward-kratos:4434
  - name: CORE_GRPC_ADDR
    value: steward-core:9091
  - name: REDIS_ADDR
    value: steward-valkey:6379
  - name: TOTP_ENC_KEY
    valueFrom:
      secretKeyRef:
        name: steward-ci-env
        key: totp-enc-key
  - name: GATEWAY_BASE_URL
    value: http://steward-gateway:8080
  - name: SMTP_HOST
    value: localhost
  - name: SMTP_PORT
    value: '1025'
  - name: SMTP_FROM
    value: no-reply@example.org
  replicaCount: 1
  podAntiAffinity: false
identity-postgres:
  enabled: false
