# An existing object-storage Secret, named for delivery and the render Jobs.
pdf-renderer:
  env:
  - {name: S3_SECRET_NAME, value: my-object-store}
delivery:
  env:
  - name: S3_ENDPOINT
    valueFrom: {secretKeyRef: {name: my-object-store, key: AWS_S3_ENDPOINT}}
  - name: S3_BUCKET
    valueFrom: {secretKeyRef: {name: my-object-store, key: S3_BUCKET}}
  - name: S3_REGION
    valueFrom: {secretKeyRef: {name: my-object-store, key: AWS_REGION}}
  - name: S3_FORCE_PATH_STYLE
    valueFrom: {secretKeyRef: {name: my-object-store, key: AWS_S3_FORCE_PATH_STYLE}}
  - name: S3_ACCESS_KEY
    valueFrom: {secretKeyRef: {name: my-object-store, key: AWS_ACCESS_KEY_ID}}
  - name: S3_SECRET_KEY
    valueFrom: {secretKeyRef: {name: my-object-store, key: AWS_SECRET_ACCESS_KEY}}
