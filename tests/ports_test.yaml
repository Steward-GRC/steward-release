suite: umbrella ports
templates:
  - charts/delivery/templates/deployment.yaml
  - charts/delivery/templates/service.yaml
  - charts/core/templates/deployment.yaml
  - charts/pdf-renderer/templates/deployment.yaml
  - charts/gateway/templates/deployment.yaml
tests:
  - it: sets delivery's internal HTTP port clear of the probe port
    template: charts/delivery/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: INTERNAL_HTTP_PORT, value: "8082"}
      - contains:
          path: spec.template.spec.containers[0].ports
          content: {name: internal-http, containerPort: 8082}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: PROBE_PORT, value: "8081"}
  - it: exposes delivery's internal HTTP port for the render Jobs
    template: charts/delivery/templates/service.yaml
    asserts:
      - contains:
          path: spec.ports
          content: {name: internal-http, port: 8082, targetPort: 8082}
  - it: passes each Go service its gRPC port in GRPC_PORT
    template: charts/core/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GRPC_PORT, value: "9091"}
  - it: passes pdf-renderer's port as its metrics port
    template: charts/pdf-renderer/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: METRICS_PORT, value: "9099"}
  - it: leaves the gateway on its own listen address
    template: charts/gateway/templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content: {name: GRPC_PORT}
