      global.serviceAccountIssuer: https://kubernetes.default.svc
    asserts:
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: WORKLOAD_OIDC_ISSUER, value: "https://kubernetes.default.svc"}}
  - it: global.serviceAccountIssuer reaches (obligations)
