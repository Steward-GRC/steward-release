  - it: global.serviceAccountIssuer reaches (ai)
    template: charts/ai/templates/deployment.yaml
    set:
      global.serviceAccountIssuer: https://kubernetes.default.svc
    asserts:
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: WORKLOAD_OIDC_ISSUER, value: "https://kubernetes.default.svc"}}
  - it: the service's own issuer wins over the global for (identity)
    template: charts/identity/templates/deployment.yaml
    set:
      global.serviceAccountIssuer: https://kubernetes.default.svc
      identity.workloadAuth.oidc.issuer: https://issuer.example.org
    asserts:
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: WORKLOAD_OIDC_ISSUER, value: "https://issuer.example.org"}}
  - it: the service's own issuer wins over the global for (workflow)
