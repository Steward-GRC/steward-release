suite: umbrella workload-auth wiring
templates:
  - charts/identity/templates/deployment.yaml
  - charts/workflow/templates/deployment.yaml
  - charts/obligations/templates/deployment.yaml
  - charts/audit/templates/deployment.yaml
  - charts/core/templates/deployment.yaml
  - charts/delivery/templates/deployment.yaml
  - charts/reporting/templates/deployment.yaml
  - charts/collab/templates/deployment.yaml
  - charts/ai/templates/deployment.yaml
  - charts/gateway/templates/deployment.yaml
  - charts/pdf-renderer/templates/deployment.yaml
release:
  namespace: steward
tests:
  # Every callee runs enabled: the verification block, never WORKLOAD_AUTH.
  - it: gives identity the verification block, its caller list and a caller token
    template: charts/identity/templates/deployment.yaml
    asserts:
      - notContains: &noDisabled {path: "spec.template.spec.containers[0].env", content: {name: WORKLOAD_AUTH}, any: true}
      - contains: &issuer {path: "spec.template.spec.containers[0].env", content: {name: WORKLOAD_OIDC_ISSUER}, any: true}
      - contains: &caFile {path: "spec.template.spec.containers[0].env", content: {name: WORKLOAD_OIDC_CA_FILE, value: /var/run/secrets/steward/kube-ca/ca.crt}}
      - contains: &bearerFile {path: "spec.template.spec.containers[0].env", content: {name: WORKLOAD_OIDC_BEARER_FILE, value: /var/run/secrets/steward/jwks/token}}
      - contains: &tokenFile {path: "spec.template.spec.containers[0].env", content: {name: WORKLOAD_TOKEN_FILE, value: /var/run/secrets/steward/token}}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WORKLOAD_ALLOWED_SERVICEACCOUNTS
            value: steward/steward-gateway,steward/steward-workflow,steward/steward-obligations,steward/steward-reporting,steward/steward-collab,steward/steward-identity
      - equal: &callerAndJwksVolume
          path: spec.template.spec.volumes[0]
          value:
            name: workload-identity
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    audience: steward
                    expirationSeconds: 3600
                - serviceAccountToken:
                    path: jwks/token
                    expirationSeconds: 3600
                - configMap:
                    name: kube-root-ca.crt
                    items:
                      - key: ca.crt
                        path: kube-ca/ca.crt
  - it: gives workflow the verification block, gateway and identity as its callers and a caller token
    template: charts/workflow/templates/deployment.yaml
    asserts:
      - notContains: *noDisabled
      - contains: *issuer
      - contains: *caFile
      - contains: *bearerFile
      - contains: *tokenFile
      - contains: &gatewayAndIdentity
          path: spec.template.spec.containers[0].env
          content: {name: WORKLOAD_ALLOWED_SERVICEACCOUNTS, value: "steward/steward-gateway,steward/steward-identity"}
      - equal: *callerAndJwksVolume
  - it: gives obligations the verification block, gateway and identity as its callers and a caller token
    template: charts/obligations/templates/deployment.yaml
    asserts:
      - notContains: *noDisabled
      - contains: *issuer
      - contains: *caFile
      - contains: *bearerFile
      - contains: *tokenFile
      - contains: *gatewayAndIdentity
      - equal: *callerAndJwksVolume
  - it: gives audit the verification block and gateway as its caller, with no caller token
    template: charts/audit/templates/deployment.yaml
    asserts:
      - notContains: *noDisabled
      - contains: *issuer
      - contains: *caFile
      - contains: *bearerFile
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: WORKLOAD_ALLOWED_SERVICEACCOUNTS, value: steward/steward-gateway}
      - notContains: {path: "spec.template.spec.containers[0].env", content: {name: WORKLOAD_TOKEN_FILE}, any: true}
      - equal:
          path: spec.template.spec.volumes[0].projected.sources
          value:
            - serviceAccountToken:
                path: jwks/token
                expirationSeconds: 3600
            - configMap:
                name: kube-root-ca.crt
                items:
                  - key: ca.crt
                    path: kube-ca/ca.crt
  - it: runs core enabled, admitting workflow and obligations
    template: charts/core/templates/deployment.yaml
    asserts:
      - notContains: *noDisabled
      - contains: *issuer
      - contains: *tokenFile
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WORKLOAD_ALLOWED_SERVICEACCOUNTS
            value: steward/steward-gateway,steward/steward-workflow,steward/steward-delivery,steward/steward-collab,steward/steward-obligations,steward/steward-identity
  - it: gives delivery the verification block and no WORKLOAD_AUTH
    template: charts/delivery/templates/deployment.yaml
    asserts: &enabled
      - notContains: *noDisabled
      - contains: *issuer
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: WORKLOAD_ALLOWED_SERVICEACCOUNTS}, any: true}
  - it: gives reporting the verification block
    template: charts/reporting/templates/deployment.yaml
    asserts: *enabled
  - it: gives collab the verification block
    template: charts/collab/templates/deployment.yaml
    asserts: *enabled
  - it: gives ai the verification block
    template: charts/ai/templates/deployment.yaml
    asserts: *enabled
  - it: makes gateway a caller only
    template: charts/gateway/templates/deployment.yaml
    asserts:
      - contains: *tokenFile
      - notContains: *noDisabled
      - notContains: {path: "spec.template.spec.containers[0].env", content: {name: WORKLOAD_OIDC_ISSUER}, any: true}
  # Not a callee or a caller itself: its render Jobs get their own token.
  - it: wires nothing into pdf-renderer
    template: charts/pdf-renderer/templates/deployment.yaml
    asserts:
      - notContains: *noDisabled
      - notContains: {path: "spec.template.spec.containers[0].env", content: {name: WORKLOAD_OIDC_ISSUER}, any: true}
      - notContains: {path: "spec.template.spec.containers[0].env", content: {name: WORKLOAD_TOKEN_FILE}, any: true}

  # global.serviceAccountIssuer feeds every callee; a per-service value wins.
  - it: global.serviceAccountIssuer reaches (identity)
    template: charts/identity/templates/deployment.yaml
    set:
      global.serviceAccountIssuer: https://kubernetes.default.svc
    asserts:
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: WORKLOAD_OIDC_ISSUER, value: "https://kubernetes.default.svc"}}
  - it: global.serviceAccountIssuer reaches (workflow)
    template: charts/workflow/templates/deployment.yaml
