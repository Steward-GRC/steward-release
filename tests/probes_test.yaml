suite: umbrella probes
templates:
  - charts/gateway/templates/deployment.yaml
  - charts/audit/templates/deployment.yaml
  - charts/core/templates/deployment.yaml
tests:
  - it: probes gateway on its one HTTP port, rendered once
    template: charts/gateway/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - {name: http, containerPort: 8080}
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value: {path: /readyz, port: http}
  - it: probes audit over HTTP on its separate probe port 8080
    template: charts/audit/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value: {path: /readyz, port: probe}
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
          value: {path: /livez, port: probe}
      - contains:
          path: spec.template.spec.containers[0].ports
          content: {name: probe, containerPort: 8080}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: PROBE_PORT, value: "8080"}
  - it: keeps the separate HTTP probe port for the services that serve it
    template: charts/core/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value: {path: /readyz, port: probe}
