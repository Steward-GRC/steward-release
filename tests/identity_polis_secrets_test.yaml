suite: identity's Polis secrets Secret
templates:
  - templates/identity-polis-secrets.yaml
  - charts/identity/templates/deployment.yaml
  - charts/identity/templates/role.yaml
  - charts/identity/templates/rolebinding.yaml
tests:
  - it: creates the empty Secret identity writes OIDC client secrets into, kept on uninstall
    template: templates/identity-polis-secrets.yaml
    asserts:
      - isKind: {of: Secret}
      - equal: {path: metadata.name, value: steward-identity-polis-secrets}
      - equal: {path: metadata.namespace, value: NAMESPACE}
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - notExists: {path: data}
      - notExists: {path: stringData}
  - it: creates no Secret when the operator brings their own
    template: templates/identity-polis-secrets.yaml
    set:
      identityPolisSecrets: {create: false}
    asserts:
      - hasDocuments: {count: 0}
  - it: creates no Secret without identity
    template: templates/identity-polis-secrets.yaml
    set:
      identity: {enabled: false}
    asserts:
      - hasDocuments: {count: 0}
  - it: grants identity get and update on that one Secret only
    template: charts/identity/templates/role.yaml
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [secrets]
              resourceNames: [steward-identity-polis-secrets]
              verbs: [get, update]
  - it: binds the Role to identity's service account
    template: charts/identity/templates/rolebinding.yaml
    asserts:
      - equal:
          path: subjects[0].name
          value: steward-identity
  - it: gives identity the API token and points it at the Secret
    template: charts/identity/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POLIS_SECRET_NAME
            value: steward-identity-polis-secrets
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POLIS_SECRET_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
