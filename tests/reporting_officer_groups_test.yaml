suite: umbrella reporting officer groups
templates:
  - charts/reporting/templates/deployment.yaml
tests:
  - it: ships an empty REPORTING_OFFICER_GROUPS value for the operator to fill in
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: REPORTING_OFFICER_GROUPS}
  - it: lets an operator set the officer groups
    set:
      reporting:
        env:
          - name: REPORTING_OFFICER_GROUPS
            value: "11111111-1111-1111-1111-111111111111,auditors"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: REPORTING_OFFICER_GROUPS, value: "11111111-1111-1111-1111-111111111111,auditors"}
