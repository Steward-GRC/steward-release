  replicaCount: 2
  podAntiAffinity: true
  port:
    name: grpc
    number: 9090
  calls:
  - {service: core, env: CORE_GRPC_ADDR}
  - {service: identity, env: IDENTITY_GRPC_ADDR}
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  postgres:
    enabled: true
    host: steward-identity-postgres-primary
    port: 5432
    database: identity
    user: app
    sslmode: require
    passwordSecretName: steward-identity-postgres-role-app
    passwordSecretKey: password
    external:
      enabled: false
      host: ''
      database: ''
      user: ''
      passwordSecretName: ''
  workloadAuth:
    caller: true
    callee: true
    authMode: enabled
    # identity's own admin CLI runs in the identity pod and calls identity.
    allowedServiceAccounts:
    - gateway
    - workflow
    - obligations
    - reporting
    - collab
    - identity

