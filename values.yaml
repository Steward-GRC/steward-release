delivery:
  enabled: true
  aliasName: delivery
  image:
    repository: ghcr.io/steward-grc/steward-delivery
    tag: v0.1.0
  replicaCount: 1
  port:
    name: grpc
    number: 9095
  calls:
  - {service: core, env: CORE_GRPC_ADDR}
  # The internal HTTP port the PDF renderer's Jobs fetch policy HTML from.
  # delivery's own default (8081) is the chart's probe port, so the chart
  # always sets it.
  extraPorts:
  - name: internal-http
    number: 8082
    env: INTERNAL_HTTP_PORT
  # PDF export: delivery creates PdfRender resources for the pdf-renderer
  # operator in its own namespace and watches their status.
  automountServiceAccountToken: true
  rbac:
    rules:
    - apiGroups: [renders.steward-grc.com]
      resources: [pdfrenders]
      verbs: [create, list, watch]
  baseEnv:
  - name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  # Where the render Jobs fetch policy HTML from: the internal-http port.
  - name: INTERNAL_BASE_URL
    value: http://steward-delivery:8082
  # On while pdf-renderer runs; the render fails if pdf-renderer is off and
  # this isn't set to "false" in delivery.env.
  - name: PDF_EXPORT_ENABLED
    value: 'true'
  # Object storage, from the one Secret the render Jobs also load
  # (pdf-renderer's S3_SECRET_NAME; the render fails if the names differ).
  # You create it, or name your existing one in both places; the chart holds
  # no credential. Until it exists delivery runs with PDF export off and
  # reports `pdfexport` degraded (docs/install.md).
  - name: S3_ENDPOINT
    valueFrom:
      secretKeyRef: {name: steward-pdf-renderer-s3, key: AWS_S3_ENDPOINT, optional: true}
  - name: S3_BUCKET
    valueFrom:
      secretKeyRef: {name: steward-pdf-renderer-s3, key: S3_BUCKET, optional: true}
  - name: S3_REGION
    valueFrom:
      secretKeyRef: {name: steward-pdf-renderer-s3, key: AWS_REGION, optional: true}
  - name: S3_FORCE_PATH_STYLE
    valueFrom:
      secretKeyRef: {name: steward-pdf-renderer-s3, key: AWS_S3_FORCE_PATH_STYLE, optional: true}
  - name: S3_ACCESS_KEY
    valueFrom:
      secretKeyRef: {name: steward-pdf-renderer-s3, key: AWS_ACCESS_KEY_ID, optional: true}
  - name: S3_SECRET_KEY
    valueFrom:
      secretKeyRef: {name: steward-pdf-renderer-s3, key: AWS_SECRET_ACCESS_KEY, optional: true}
  postgres:
    enabled: true
    host: steward-delivery-postgres-primary
    port: 5432
    database: delivery
    user: app
    sslmode: require
    passwordSecretName: steward-delivery-postgres-role-app
    passwordSecretKey: password
    external:
      enabled: false
      host: ''
      database: ''
      user: ''
      passwordSecretName: ''
  workloadAuth:
    caller: true
    callee: true
    authMode: enabled
    allowedServiceAccounts:
    - gateway
    - pdf-renderer

pdf-renderer:
  enabled: true
  aliasName: pdf-renderer
  image:
    repository: ghcr.io/steward-grc/steward-pdf-renderer
    tag: v0.1.0
  replicaCount: 1
  port:
    name: grpc
    number: 9099
    env: METRICS_PORT
  # Not a caller itself: the operator gives each render Job its own
  # steward-audience token for the fetch from delivery.
  #
  # The operator reconciles PdfRenders into Jobs, so it gets the API token,
  # on its own service account, with a Role holding only the calls its
  # controller and leader election make (narrower than its RBAC markers;
  # docs/install.md maps each rule). The Jobs run as steward-pdf-renderer
  # (the caller name delivery's allow-list expects), with no RBAC and no API
  # token.
  serviceAccount:
    name: steward-pdf-renderer-operator
  extraServiceAccounts:
  - steward-pdf-renderer
  automountServiceAccountToken: true
  rbac:
    rules:
    - apiGroups: [renders.steward-grc.com]
      resources: [pdfrenders]
      verbs: [get, list, watch]
    - apiGroups: [renders.steward-grc.com]
      resources: [pdfrenders/status]
      verbs: [update]
    # The Jobs it creates carry an owner reference that blocks the
    # PdfRender's deletion, which needs update on its finalizers.
    - apiGroups: [renders.steward-grc.com]
      resources: [pdfrenders/finalizers]
      verbs: [update]
    - apiGroups: [batch]
      resources: [jobs]
      verbs: [get, list, watch, create]
    - apiGroups: [""]
      resources: [events]
      verbs: [create, patch]
    # Leader election: create the lease once, then read and renew only its own.
    - apiGroups: [coordination.k8s.io]
      resources: [leases]
      verbs: [create]
    - apiGroups: [coordination.k8s.io]
      resources: [leases]
      resourceNames: [steward-pdf-renderer.renders.steward-grc.com]
      verbs: [get, update]
  baseEnv:
  - name: WATCH_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  - name: JOB_SERVICE_ACCOUNT
    value: steward-pdf-renderer
  # The image every render Job runs (the repo's Dockerfile.renderer).
  - name: RENDERER_IMAGE
    value: ghcr.io/steward-grc/steward-pdf-renderer-renderer:v0.1.0
  # The Secret every render Job loads whole (envFrom) for its object storage:
  # AWS_S3_ENDPOINT, AWS_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and
  # AWS_S3_FORCE_PATH_STYLE, plus S3_BUCKET for delivery. delivery reads the
  # same Secret, so both use one store and delivery's bucket.
  - name: S3_SECRET_NAME
    value: steward-pdf-renderer-s3

