reporting:
  enabled: true
  aliasName: reporting
  image:
    repository: ghcr.io/steward-grc/steward-reporting
    tag: v0.1.0
  replicaCount: 1
  port:
    name: grpc
    number: 9098
  postgres:
    enabled: true
    host: steward-reporting-postgres-primary
    port: 5432
    database: reporting
    user: app
    sslmode: require
    passwordSecretName: steward-reporting-postgres-role-app
    passwordSecretKey: password
    external:
      enabled: false
      host: ''
      database: ''
      user: ''
      passwordSecretName: ''
  workloadAuth:
    caller: true
    callee: true
    authMode: enabled
    allowedServiceAccounts:
    - gateway

gateway:
  enabled: true
  aliasName: gateway
  opaBundle:
    enabled: true
    image:
      repository: ghcr.io/steward-grc/steward-authz-bundle
      tag: v0.1.0
  image:
    repository: ghcr.io/steward-grc/steward-gateway
    tag: v0.1.0
  replicaCount: 2
  podAntiAffinity: true
  port:
    name: http
    number: 8080
  # gateway serves /livez and /readyz on its one HTTP port.
  probePort: 8080
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  workloadAuth:
    caller: true

web:
  enabled: true
  aliasName: web
  image:
    repository: ghcr.io/steward-grc/steward-web
    tag: v0.1.0
  replicaCount: 2
  port:
    name: http
    number: 3000

# ---------------------------------------------------------------------------
# Bugs5382/helm-postgres-ha, one instance per data-owning service. `replicas`
# is user-set: 1 here, 3 (a quorum) in values-ha-example.yaml. Set
# `<service>-postgres.enabled: false` plus the service's own
# `<service>.postgres.external.*` to bring your own Postgres instead.
# ---------------------------------------------------------------------------
identity-postgres:
  enabled: true
  fullnameOverride: steward-identity-postgres
  replicas: 1
  databases:
  - name: identity
    owner: app

core-postgres:
  enabled: true
  fullnameOverride: steward-core-postgres
  replicas: 1
  databases:
  - name: core
    owner: app

workflow-postgres:
  enabled: true
  fullnameOverride: steward-workflow-postgres
  replicas: 1
  databases:
  - name: workflow
    owner: app

obligations-postgres:
  enabled: true
  fullnameOverride: steward-obligations-postgres
  replicas: 1
  databases:
  - name: obligations
    owner: app

audit-postgres:
  enabled: true
  fullnameOverride: steward-audit-postgres
  replicas: 1
  databases:
  - name: audit
    owner: app

delivery-postgres:
  enabled: true
  fullnameOverride: steward-delivery-postgres
  replicas: 1
  databases:
  - name: delivery
    owner: app

collab-postgres:
  enabled: true
  fullnameOverride: steward-collab-postgres
  replicas: 1
  databases:
  - name: collab
    owner: app

ai-postgres:
  enabled: true
  fullnameOverride: steward-ai-postgres
  replicas: 1
  databases:
  - name: ai
    owner: app

reporting-postgres:
  enabled: true
  fullnameOverride: steward-reporting-postgres
  replicas: 1
  databases:
  - name: reporting
    owner: app
