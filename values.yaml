    host: steward-collab-postgres-primary
    port: 5432
    database: collab
    user: app
    sslmode: require
    passwordSecretName: steward-collab-postgres-role-app
    passwordSecretKey: password
    external:
      enabled: false
      host: ''
      database: ''
      user: ''
      passwordSecretName: ''
  workloadAuth:
    caller: true
    callee: true
    authMode: enabled
    allowedServiceAccounts:
    - gateway

ai:
  enabled: true
  aliasName: ai
  opaBundle:
    enabled: true
    image:
      repository: ghcr.io/steward-grc/steward-authz-bundle
      tag: v0.1.0
  image:
    repository: ghcr.io/steward-grc/steward-ai
    tag: v0.1.0
  replicaCount: 1
  port:
    name: grpc
    number: 9097
  postgres:
    enabled: true
    host: steward-ai-postgres-primary
    port: 5432
    database: ai
    user: app
    sslmode: require
    passwordSecretName: steward-ai-postgres-role-app
    passwordSecretKey: password
    external:
      enabled: false
      host: ''
      database: ''
