# Per-service values for the umbrella chart. Each top-level key matches an
# alias declared in Chart.yaml. The reusable charts/_service chart's defaults
# apply unless overridden here. Image repository/tag are placeholders until
# each service repo publishes real images; the Harbor/GHCR path and the exact
# tag are an operator concern at install time, not a default this chart ships.

identity:
  enabled: true
  aliasName: identity
  image:
    repository: ghcr.io/steward-grc/steward-identity
    tag: v0.1.0
  replicaCount: 2
  podAntiAffinity: true
  port:
    name: grpc
    number: 9090
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  postgres:
    enabled: true
    host: steward-identity-postgres-primary
    port: 5432
    database: identity
    user: app
    sslmode: require
    passwordSecretName: steward-identity-postgres-role-app
    passwordSecretKey: password
    external:
      enabled: false
      host: ''
      database: ''
      user: ''
      passwordSecretName: ''
  # No workload-auth library yet: the chart wires no WORKLOAD_* settings, and
  # the caller list only scopes the NetworkPolicy (see
  # docs/service-to-service-auth.md).
  workloadAuth:
    allowedServiceAccounts:
    - gateway
    - core
    - workflow
    - obligations
    - reporting
    - collab

core:
  enabled: true
  aliasName: core
  opaBundle:
    enabled: true
    image:
      repository: ghcr.io/steward-grc/steward-authz-bundle
      tag: v0.1.0
  image:
    repository: ghcr.io/steward-grc/steward-core
    tag: v0.1.0
  replicaCount: 2
  podAntiAffinity: true
  port:
    name: grpc
    number: 9091
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  postgres:
    enabled: true
    host: steward-core-postgres-primary
    port: 5432
    database: core
    user: app
    sslmode: require
    passwordSecretName: steward-core-postgres-role-app
    passwordSecretKey: password
    external:
      enabled: false
      host: ''
      database: ''
      user: ''
      passwordSecretName: ''
  workloadAuth:
    caller: true
    callee: true
    authMode: disabled
    allowedServiceAccounts:
    - gateway
    - workflow
    - delivery
    - collab
    - obligations
    - identity

workflow:
  enabled: true
  aliasName: workflow
  image:
    repository: ghcr.io/steward-grc/steward-workflow
    tag: v0.1.0
  replicaCount: 1
  port:
    name: grpc
    number: 9092
  postgres:
    enabled: true
    host: steward-workflow-postgres-primary
    port: 5432
    database: workflow
    user: app
    sslmode: require
    passwordSecretName: steward-workflow-postgres-role-app
    passwordSecretKey: password
    external:
      enabled: false
      host: ''
      database: ''
      user: ''
      passwordSecretName: ''
  # No workload-auth library yet: the chart wires no WORKLOAD_* settings, and
  # the caller list only scopes the NetworkPolicy (see
  # docs/service-to-service-auth.md).
  workloadAuth:
    allowedServiceAccounts:
    - gateway

obligations:
  enabled: true
  aliasName: obligations
  image:
    repository: ghcr.io/steward-grc/steward-obligations
    tag: v0.1.0
  replicaCount: 1
  port:
    name: grpc
    number: 9093
  postgres:
    enabled: true
    host: steward-obligations-postgres-primary
    port: 5432
    database: obligations
    user: app
    sslmode: require
    passwordSecretName: steward-obligations-postgres-role-app
    passwordSecretKey: password
    external:
      enabled: false
      host: ''
      database: ''
      user: ''
      passwordSecretName: ''
  # No workload-auth library yet: the chart wires no WORKLOAD_* settings, and
  # the caller list only scopes the NetworkPolicy (see
  # docs/service-to-service-auth.md).
  workloadAuth:
    allowedServiceAccounts:
    - gateway
    - reporting

audit:
  enabled: true
  aliasName: audit
  image:
    repository: ghcr.io/steward-grc/steward-audit
    tag: v0.1.0
  replicaCount: 1
  port:
    name: grpc
    number: 9094
  # audit has no HTTP listener; it serves grpc.health.v1 on its gRPC port.
  probe:
    type: grpc
  postgres:
    enabled: true
    host: steward-audit-postgres-primary
    port: 5432
    database: audit
    user: app
    sslmode: require
    passwordSecretName: steward-audit-postgres-role-app
    passwordSecretKey: password
    external:
      enabled: false
      host: ''
      database: ''
      user: ''
      passwordSecretName: ''
  # No workload-auth library yet: the chart wires no WORKLOAD_* settings, and
  # the caller list only scopes the NetworkPolicy (see
  # docs/service-to-service-auth.md).
  workloadAuth:
    allowedServiceAccounts:
    - gateway
    - reporting

delivery:
  enabled: true
  aliasName: delivery
  image:
    repository: ghcr.io/steward-grc/steward-delivery
    tag: v0.1.0
  replicaCount: 1
  port:
    name: grpc
    number: 9095
  # The internal HTTP port the PDF renderer's Jobs fetch policy HTML from.
  # delivery's own default (8081) is the chart's probe port, so the chart
  # always sets it.
  extraPorts:
  - name: internal-http
    number: 8082
    env: INTERNAL_HTTP_PORT
  # PDF export: delivery creates PdfRender resources for the pdf-renderer
  # operator in its own namespace and watches their status.
  automountServiceAccountToken: true
  rbac:
    rules:
    - apiGroups: [renders.steward-grc.com]
      resources: [pdfrenders]
      verbs: [create, list, watch]
  baseEnv:
  - name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  # Where the render Jobs fetch policy HTML from: the internal-http port.
  - name: INTERNAL_BASE_URL
    value: http://steward-delivery:8082
  postgres:
    enabled: true
    host: steward-delivery-postgres-primary
    port: 5432
    database: delivery
    user: app
    sslmode: require
    passwordSecretName: steward-delivery-postgres-role-app
    passwordSecretKey: password
    external:
      enabled: false
      host: ''
      database: ''
      user: ''
      passwordSecretName: ''
  workloadAuth:
    caller: true
    callee: true
    authMode: enabled
    allowedServiceAccounts:
    - gateway
    - pdf-renderer

pdf-renderer:
  enabled: true
  aliasName: pdf-renderer
  image:
    repository: ghcr.io/steward-grc/steward-pdf-renderer
    tag: v0.1.0
  replicaCount: 1
  port:
    name: grpc
    number: 9099
    env: METRICS_PORT
  # Not a caller itself: the operator gives each render Job its own
  # steward-audience token for the fetch from delivery.
  #
  # The operator reconciles PdfRenders into Jobs, so it gets the API token,
  # on its own service account, with exactly its controller's RBAC markers
  # plus leader election. The Jobs run as steward-pdf-renderer (the caller
  # name delivery's allow-list expects), with no RBAC and no API token.
  serviceAccount:
    name: steward-pdf-renderer-operator
  extraServiceAccounts:
  - steward-pdf-renderer
  automountServiceAccountToken: true
  rbac:
    rules:
    - apiGroups: [renders.steward-grc.com]
      resources: [pdfrenders]
      verbs: [get, list, watch, create, update, patch, delete]
    - apiGroups: [renders.steward-grc.com]
      resources: [pdfrenders/status]
      verbs: [get, update, patch]
    - apiGroups: [renders.steward-grc.com]
      resources: [pdfrenders/finalizers]
      verbs: [update]
    - apiGroups: [batch]
      resources: [jobs]
      verbs: [get, list, watch, create, update, patch, delete]
    - apiGroups: [""]
      resources: [events]
      verbs: [create, patch]
    - apiGroups: [coordination.k8s.io]
      resources: [leases]
      verbs: [get, list, watch, create, update, patch, delete]
  baseEnv:
  - name: WATCH_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  - name: JOB_SERVICE_ACCOUNT
    value: steward-pdf-renderer
  # The image every render Job runs (the repo's Dockerfile.renderer).
  - name: RENDERER_IMAGE
    value: ghcr.io/steward-grc/steward-pdf-renderer-renderer:v0.1.0

collab:
  enabled: true
  aliasName: collab
  image:
    repository: ghcr.io/steward-grc/steward-collab
    tag: v0.1.0
  replicaCount: 1
  port:
    name: grpc
    number: 9096
  postgres:
    enabled: true
    host: steward-collab-postgres-primary
    port: 5432
    database: collab
    user: app
    sslmode: require
    passwordSecretName: steward-collab-postgres-role-app
    passwordSecretKey: password
    external:
      enabled: false
      host: ''
      database: ''
      user: ''
      passwordSecretName: ''
  workloadAuth:
    caller: true
    callee: true
    authMode: enabled
    allowedServiceAccounts:
    - gateway

ai:
  enabled: true
  aliasName: ai
  opaBundle:
    enabled: true
    image:
      repository: ghcr.io/steward-grc/steward-authz-bundle
      tag: v0.1.0
  image:
    repository: ghcr.io/steward-grc/steward-ai
    tag: v0.1.0
  replicaCount: 1
  port:
    name: grpc
    number: 9097
  # ai's server creates and reads PolicyAIJob resources (its job endpoints
  # and the related-policy re-evaluation) in its own namespace.
  automountServiceAccountToken: true
  rbac:
    rules:
    - apiGroups: [ai.steward-grc.com]
      resources: [policyaijobs]
      verbs: [get, create]
  baseEnv:
  - name: AI_JOB_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  postgres:
    enabled: true
    host: steward-ai-postgres-primary
    port: 5432
    database: ai
    user: app
    sslmode: require
    passwordSecretName: steward-ai-postgres-role-app
    passwordSecretKey: password
    # ai's baseline migration creates vector columns (pgvector). Shown in the
    # install notes; a bring-your-own database must have it before ai starts.
    requiredExtensions:
    - vector
    external:
      enabled: false
      host: ''
      database: ''
      user: ''
      passwordSecretName: ''
  workloadAuth:
    callee: true
    authMode: enabled
    allowedServiceAccounts:
    - gateway

reporting:
  enabled: true
  aliasName: reporting
  image:
    repository: ghcr.io/steward-grc/steward-reporting
    tag: v0.1.0
  replicaCount: 1
  port:
    name: grpc
    number: 9098
  postgres:
    enabled: true
    host: steward-reporting-postgres-primary
    port: 5432
    database: reporting
    user: app
    sslmode: require
    passwordSecretName: steward-reporting-postgres-role-app
    passwordSecretKey: password
    external:
      enabled: false
      host: ''
      database: ''
      user: ''
      passwordSecretName: ''
  workloadAuth:
    caller: true
    callee: true
    authMode: enabled
    allowedServiceAccounts:
    - gateway

gateway:
  enabled: true
  aliasName: gateway
  opaBundle:
    enabled: true
    image:
      repository: ghcr.io/steward-grc/steward-authz-bundle
      tag: v0.1.0
  image:
    repository: ghcr.io/steward-grc/steward-gateway
    tag: v0.1.0
  replicaCount: 2
  podAntiAffinity: true
  port:
    name: http
    number: 8080
    # GATEWAY_HTTP_ADDR's default (:8080) already matches.
    env: ''
  # gateway serves /livez and /readyz on its one HTTP port.
  probePort: 8080
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  workloadAuth:
    caller: true

web:
  enabled: true
  aliasName: web
  image:
    repository: ghcr.io/steward-grc/steward-web
    tag: v0.1.0
  replicaCount: 2
  port:
    name: http
    number: 3000
    env: PORT

# ---------------------------------------------------------------------------
# Bugs5382/helm-postgres-ha, one instance per data-owning service. `replicas`
# is user-set: 1 here, 3 (a quorum) in values-ha-example.yaml. Set
# `<service>-postgres.enabled: false` plus the service's own
# `<service>.postgres.external.*` to bring your own Postgres instead.
# ---------------------------------------------------------------------------
identity-postgres:
  enabled: true
  fullnameOverride: steward-identity-postgres
  replicas: 1
  databases:
  - name: identity
    owner: app

core-postgres:
  enabled: true
  fullnameOverride: steward-core-postgres
  replicas: 1
  databases:
  - name: core
    owner: app

workflow-postgres:
  enabled: true
  fullnameOverride: steward-workflow-postgres
  replicas: 1
  databases:
  - name: workflow
    owner: app

obligations-postgres:
  enabled: true
  fullnameOverride: steward-obligations-postgres
  replicas: 1
  databases:
  - name: obligations
    owner: app

audit-postgres:
  enabled: true
  fullnameOverride: steward-audit-postgres
  replicas: 1
  databases:
  - name: audit
    owner: app

delivery-postgres:
  enabled: true
  fullnameOverride: steward-delivery-postgres
  replicas: 1
  databases:
  - name: delivery
    owner: app

collab-postgres:
  enabled: true
  fullnameOverride: steward-collab-postgres
  replicas: 1
  databases:
  - name: collab
    owner: app

ai-postgres:
  enabled: true
  fullnameOverride: steward-ai-postgres
  replicas: 1
  # ai needs pgvector, which the official postgres image doesn't ship: the
  # pgvector image is that image plus the extension, same major and base.
  image:
    registry: docker.io
    repository: pgvector/pgvector
    tag: "0.8.7-pg18-bookworm"
    digest: "sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11"
  databases:
  - name: ai
    owner: app
    extensions:
    - vector

reporting-postgres:
  enabled: true
  fullnameOverride: steward-reporting-postgres
  replicas: 1
  databases:
  - name: reporting
    owner: app
