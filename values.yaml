# Per-service values for the umbrella chart. Each top-level key matches an
# alias declared in Chart.yaml. The reusable charts/_service chart's defaults
# apply unless overridden here. Image repository/tag are placeholders until
# each service repo publishes real images; the Harbor/GHCR path and the exact
# tag are an operator concern at install time, not a default this chart ships.

# Cluster-scoped objects. The chart installs none by default: on a shared
# cluster they belong to the cluster, not to one release, so each one is an
# explicit opt-in with a use-the-existing-one path (docs/install.md).
crds:
  # true: helm installs the PdfRender and PolicyAIJob CRDs from crds/ on
  # first install (needs cluster-admin). false: they must already exist.
  install: false

global:
  # Each service's main port, for the addresses the chart gives the services
  # that call it (`<alias>.calls`: steward-<alias>:<port>). Each must equal
  # that alias's `port.number`; the render fails otherwise, so change both.
  servicePorts:
    identity: 9090
    core: 9091
    workflow: 9092
    obligations: 9093
    audit: 9094
    delivery: 9095
    collab: 9096
    ai: 9097
    reporting: 9098
    gateway: 8080

