# Per-service values for the umbrella chart. Each top-level key matches an
# alias declared in Chart.yaml. The reusable charts/_service chart's defaults
# apply unless overridden here. Image repository/tag are placeholders until
# each service repo publishes real images; the Harbor/GHCR path and the exact
# tag are an operator concern at install time, not a default this chart ships.

identity:
  enabled: true
  aliasName: identity
  image:
    repository: ghcr.io/steward-grc/steward-identity
    tag: v0.1.0
  replicaCount: 2
  podAntiAffinity: true
  port:
    name: grpc
    number: 9090
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  postgres:
    enabled: true
    host: steward-identity-postgres-primary
    port: 5432
    database: identity
    user: app
    sslmode: require
    passwordSecretName: steward-identity-postgres-role-app
    passwordSecretKey: password
    external:
      enabled: false
      host: ''
      database: ''
      user: ''
      passwordSecretName: ''
  workloadAuth:
    callee: true
    authMode: enabled
    allowedServiceAccounts:
    - gateway
    - core
    - workflow
    - obligations
    - reporting
    - collab

core:
  enabled: true
  aliasName: core
  opaBundle:
    enabled: true
    image:
      repository: ghcr.io/steward-grc/steward-authz-bundle
      tag: v0.1.0
  image:
    repository: ghcr.io/steward-grc/steward-core
    tag: v0.1.0
  replicaCount: 2
  podAntiAffinity: true
  port:
    name: grpc
    number: 9091
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  postgres:
    enabled: true
    host: steward-core-postgres-primary
    port: 5432
    database: core
    user: app
    sslmode: require
    passwordSecretName: steward-core-postgres-role-app
    passwordSecretKey: password
    external:
      enabled: false
      host: ''
      database: ''
      user: ''
      passwordSecretName: ''
  workloadAuth:
    caller: true
    callee: true
    authMode: disabled
    allowedServiceAccounts:
    - gateway
    - workflow
    - delivery
    - collab
    - obligations

workflow:
  enabled: true
  aliasName: workflow
  image:
    repository: ghcr.io/steward-grc/steward-workflow
    tag: v0.1.0
  replicaCount: 1
  port:
    name: grpc
    number: 9092
  postgres:
    enabled: true
    host: steward-workflow-postgres-primary
    port: 5432
    database: workflow
    user: app
    sslmode: require
    passwordSecretName: steward-workflow-postgres-role-app
    passwordSecretKey: password
    external:
      enabled: false
      host: ''
      database: ''
      user: ''
      passwordSecretName: ''
  workloadAuth:
    caller: true
    callee: true
    authMode: enabled
    allowedServiceAccounts:
    - gateway

obligations:
  enabled: true
  aliasName: obligations
  image:
    repository: ghcr.io/steward-grc/steward-obligations
    tag: v0.1.0
  replicaCount: 1
  port:
    name: grpc
    number: 9093
  postgres:
    enabled: true
    host: steward-obligations-postgres-primary
    port: 5432
    database: obligations
    user: app
    sslmode: require
    passwordSecretName: steward-obligations-postgres-role-app
    passwordSecretKey: password
    external:
      enabled: false
      host: ''
      database: ''
      user: ''
      passwordSecretName: ''
  workloadAuth:
    caller: true
    callee: true
    authMode: enabled
    allowedServiceAccounts:
    - gateway
    - reporting

audit:
  enabled: true
  aliasName: audit
  image:
    repository: ghcr.io/steward-grc/steward-audit
    tag: v0.1.0
  replicaCount: 1
  port:
    name: grpc
    number: 9094
  # audit has no HTTP listener; it serves grpc.health.v1 on its gRPC port.
  probe:
    type: grpc
  postgres:
    enabled: true
    host: steward-audit-postgres-primary
    port: 5432
    database: audit
    user: app
    sslmode: require
    passwordSecretName: steward-audit-postgres-role-app
    passwordSecretKey: password
    external:
      enabled: false
      host: ''
      database: ''
      user: ''
      passwordSecretName: ''
  workloadAuth:
    callee: true
    authMode: enabled
    allowedServiceAccounts:
    - gateway
    - reporting

delivery:
  enabled: true
  aliasName: delivery
  image:
    repository: ghcr.io/steward-grc/steward-delivery
    tag: v0.1.0
  replicaCount: 1
  port:
    name: grpc
    number: 9095
  # The internal HTTP port the PDF renderer's Jobs fetch policy HTML from.
  # delivery's own default (8081) is the chart's probe port, so the chart
  # always sets it.
  extraPorts:
  - name: internal-http
    number: 8082
    env: INTERNAL_HTTP_PORT
  postgres:
    enabled: true
    host: steward-delivery-postgres-primary
    port: 5432
    database: delivery
    user: app
    sslmode: require
    passwordSecretName: steward-delivery-postgres-role-app
    passwordSecretKey: password
    external:
      enabled: false
      host: ''
      database: ''
      user: ''
      passwordSecretName: ''
  workloadAuth:
    caller: true
    callee: true
    authMode: enabled
    allowedServiceAccounts:
    - gateway
    - pdf-renderer

pdf-renderer:
  enabled: true
  aliasName: pdf-renderer
  image:
    repository: ghcr.io/steward-grc/steward-pdf-renderer
    tag: v0.1.0
  replicaCount: 1
  port:
    name: grpc
    number: 9099
  workloadAuth:
    caller: true

collab:
  enabled: true
  aliasName: collab
  image:
