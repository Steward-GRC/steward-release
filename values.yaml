# steward-web's two apps, each its own image (steward-web's Dockerfile, built
# with APP=staff or APP=admin) and its own Deployment and Service. Both
# server-render against the gateway and proxy its /query and /collab/ws, and
# serve /livez and /readyz on their one HTTP port. Each also needs the
# browser-facing Kratos public URL (KRATOS_PUBLIC_URL in `env`). Set
# `ingress` to expose one; docs/install.md.
web-staff:
  enabled: true
  aliasName: web-staff
  image:
    repository: ghcr.io/steward-grc/steward-web-staff
    tag: v0.1.0
  replicaCount: 2
  port:
    name: http
    number: 3000
    env: PORT
  probePort: 3000
  # The image's own user (steward), not the Go images' nonroot.
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
  calls:
  - {service: gateway, env: GATEWAY_URL, scheme: http, path: /query}
  ingress:
    enabled: false
    className: ''
    annotations: {}
    hosts: []
    # - host: steward.example.org
    #   paths:
    #   - {path: /, pathType: Prefix}
    tls: []

web-admin:
  enabled: true
  aliasName: web-admin
  image:
    repository: ghcr.io/steward-grc/steward-web-admin
    tag: v0.1.0
  replicaCount: 1
  port:
    name: http
    number: 3000
    env: PORT
  probePort: 3000
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
  calls:
  - {service: gateway, env: GATEWAY_URL, scheme: http, path: /query}
  ingress:
    enabled: false
    className: ''
    annotations: {}
    hosts: []
    # - host: steward-admin.example.org
    #   paths:
    #   - {path: /, pathType: Prefix}
    tls: []

# ---------------------------------------------------------------------------
# Bugs5382/helm-postgres-ha, one instance per data-owning service. `replicas`
# is user-set: 1 here, 3 (a quorum) in values-ha-example.yaml. Set
# `<service>-postgres.enabled: false` plus the service's own
# `<service>.postgres.external.*` to bring your own Postgres instead.
#
# TLS: each instance uses cert-manager (`tls.certManager.enabled`, on by
# default) with a namespaced self-signed CA Issuer of its own. To sign with
# the cluster's existing Issuer or ClusterIssuer, set
# `<service>-postgres.tls.certManager.issuerRef` ({kind, name}); to
# skip cert-manager, set `tls.certManager.enabled: false` and
# `tls.existingSecret`. values-shared-cluster-example.yaml does the first
# for every instance. No instance creates a cluster-scoped object.
# ---------------------------------------------------------------------------
identity-postgres:
  enabled: true
  fullnameOverride: steward-identity-postgres
  replicas: 1
  databases:
  - name: identity
    owner: app

core-postgres:
  enabled: true
  fullnameOverride: steward-core-postgres
  replicas: 1
  databases:
  - name: core
    owner: app

workflow-postgres:
  enabled: true
  fullnameOverride: steward-workflow-postgres
  replicas: 1
  databases:
  - name: workflow
    owner: app

obligations-postgres:
  enabled: true
  fullnameOverride: steward-obligations-postgres
  replicas: 1
  databases:
  - name: obligations
    owner: app

audit-postgres:
  enabled: true
  fullnameOverride: steward-audit-postgres
  replicas: 1
  databases:
  - name: audit
    owner: app

delivery-postgres:
  enabled: true
  fullnameOverride: steward-delivery-postgres
  replicas: 1
  databases:
  - name: delivery
    owner: app

collab-postgres:
  enabled: true
  fullnameOverride: steward-collab-postgres
  replicas: 1
  databases:
  - name: collab
    owner: app

ai-postgres:
  enabled: true
  fullnameOverride: steward-ai-postgres
  replicas: 1
  # ai needs pgvector, which the official postgres image doesn't ship: the
  # pgvector image is that image plus the extension, same major and base.
  image:
    registry: docker.io
    repository: pgvector/pgvector
    tag: "0.8.7-pg18-bookworm"
    digest: "sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11"
  databases:
  - name: ai
    owner: app
    extensions:
    - vector

reporting-postgres:
  enabled: true
  fullnameOverride: steward-reporting-postgres
  replicas: 1
  databases:
  - name: reporting
    owner: app
