{{/*
Defence in depth, never the only control: the per-method workload-auth check
in each callee is what actually enforces the caller list. This policy only
narrows which pods can reach the port at all.
*/}}
{{- if and .Values.networkPolicy.enabled .Values.workloadAuth.callee }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "service-chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "service-chart.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.workloadAuth.allowedServiceAccounts }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: steward-{{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.port.number }}
    {{- if include "service-chart.separateProbePort" . }}
    # No `from`: the probe port stays reachable by the kubelet health check
    # from any source, same as every other control in this chart that scopes
    # the business port, not the probe. It carries no secret or token. A gRPC
    # probe on the main port opens nothing extra: the kubelet probes from the
    # node, which NetworkPolicy implementations allow to reach local pods.
    - ports:
        - port: {{ .Values.probePort }}
    {{- end }}
{{- end }}
