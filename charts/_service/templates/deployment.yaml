apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service-chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "service-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "service-chart.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "service-chart.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- if .Values.podAntiAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "service-chart.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Values.aliasName | default .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- $probeType := include "service-chart.probeType" . }}
          {{- $separateProbe := include "service-chart.separateProbePort" . }}
          {{- $probePortName := ternary "probe" .Values.port.name (eq $separateProbe "true") }}
          ports:
            - name: {{ .Values.port.name }}
              containerPort: {{ .Values.port.number }}
            {{- if $separateProbe }}
            - name: probe
              containerPort: {{ .Values.probePort }}
            {{- end }}
          readinessProbe:
            {{- if eq $probeType "grpc" }}
            grpc:
              port: {{ .Values.port.number }}
            {{- else }}
            httpGet:
              path: /readyz
              port: {{ $probePortName }}
            {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            {{- if eq $probeType "grpc" }}
            grpc:
              port: {{ .Values.port.number }}
            {{- else }}
            httpGet:
              path: /livez
              port: {{ $probePortName }}
            {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
          env:
            - name: LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.logging.format | quote }}
            {{- if eq $probeType "http" }}
            - name: PROBE_PORT
              value: {{ .Values.probePort | quote }}
            {{- end }}
            - name: PORT
              value: {{ .Values.port.number | quote }}
            {{- if .Values.postgres.enabled }}
            {{- $pg := ternary .Values.postgres.external .Values.postgres .Values.postgres.external.enabled }}
            - name: DATABASE_HOST
              value: {{ required "postgres host is required when postgres.enabled" $pg.host | quote }}
            - name: DATABASE_PORT
              value: {{ $pg.port | quote }}
            - name: DATABASE_NAME
              value: {{ required "postgres database is required when postgres.enabled" $pg.database | quote }}
            - name: DATABASE_USER
              value: {{ required "postgres user is required when postgres.enabled" $pg.user | quote }}
            - name: DATABASE_SSLMODE
              value: {{ $pg.sslmode | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgres passwordSecretName is required when postgres.enabled" $pg.passwordSecretName }}
                  key: {{ $pg.passwordSecretKey }}
            {{- end }}
            {{- if .Values.workloadAuth.callee }}
            - name: WORKLOAD_AUTH
              value: {{ .Values.workloadAuth.authMode | quote }}
            - name: WORKLOAD_AUDIENCE
              value: {{ .Values.workloadAuth.audience | quote }}
            - name: WORKLOAD_OIDC_ISSUER
              value: {{ required "workloadAuth.oidc.issuer is required when workloadAuth.callee is true" .Values.workloadAuth.oidc.issuer | quote }}
            - name: WORKLOAD_OIDC_JWKS_URL
              value: {{ required "workloadAuth.oidc.jwksUrl is required when workloadAuth.callee is true" .Values.workloadAuth.oidc.jwksUrl | quote }}
            - name: WORKLOAD_OIDC_CA_FILE
              value: {{ .Values.workloadAuth.oidc.caFile | quote }}
            - name: WORKLOAD_OIDC_BEARER_FILE
              value: {{ .Values.workloadAuth.oidc.bearerFile | default .Values.workloadAuth.tokenPath | quote }}
            - name: WORKLOAD_ALLOWED_SERVICEACCOUNTS
              value: {{ include "service-chart.allowedServiceAccounts" . | quote }}
            {{- end }}
            {{- if .Values.workloadAuth.caller }}
            - name: WORKLOAD_TOKEN_FILE
              value: {{ .Values.workloadAuth.tokenPath | quote }}
            {{- end }}
            {{- if .Values.opaBundle.enabled }}
            - name: OPA_BUNDLE_PATH
              value: {{ .Values.opaBundle.mountPath | quote }}
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name }}
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.workloadAuth.caller .Values.opaBundle.enabled }}
          volumeMounts:
            {{- if .Values.workloadAuth.caller }}
            - name: workload-token
              mountPath: /var/run/secrets/steward
              readOnly: true
            {{- end }}
            {{- if .Values.opaBundle.enabled }}
            - name: opa-bundle
              mountPath: {{ .Values.opaBundle.mountPath }}
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if .Values.opaBundle.enabled }}
      initContainers:
        - name: opa-bundle
          image: "{{ .Values.opaBundle.image.repository }}:{{ .Values.opaBundle.image.tag }}"
          imagePullPolicy: {{ .Values.opaBundle.image.pullPolicy }}
          command: ["sh", "-c", "cp -r /bundle/. {{ .Values.opaBundle.mountPath }}"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: opa-bundle
              mountPath: {{ .Values.opaBundle.mountPath }}
      {{- end }}
      {{- if or .Values.workloadAuth.caller .Values.opaBundle.enabled }}
      volumes:
        {{- if .Values.workloadAuth.caller }}
        - name: workload-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.workloadAuth.audience }}
                  expirationSeconds: 3600
        {{- end }}
        {{- if .Values.opaBundle.enabled }}
        - name: opa-bundle
          emptyDir: {}
        {{- end }}
      {{- end }}
