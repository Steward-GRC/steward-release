apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service-chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "service-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "service-chart.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "service-chart.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- if .Values.podAntiAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "service-chart.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Values.aliasName | default .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- $probeType := include "service-chart.probeType" . }}
          {{- $separateProbe := include "service-chart.separateProbePort" . }}
          {{- $probePortName := ternary "probe" .Values.port.name (eq $separateProbe "true") }}
          ports:
            {{- range (include "service-chart.containerPorts" . | fromJsonArray) }}
            - name: {{ .name }}
              containerPort: {{ .number }}
            {{- end }}
          readinessProbe:
            {{- if eq $probeType "grpc" }}
            grpc:
              port: {{ .Values.port.number }}
            {{- else }}
            httpGet:
              path: /readyz
              port: {{ $probePortName }}
            {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            {{- if eq $probeType "grpc" }}
            grpc:
              port: {{ .Values.port.number }}
            {{- else }}
            httpGet:
              path: /livez
              port: {{ $probePortName }}
            {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
          env:
            - name: LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.logging.format | quote }}
            {{- if eq $probeType "http" }}
            - name: PROBE_PORT
              value: {{ .Values.probePort | quote }}
            {{- end }}
            {{- with .Values.port.env }}
            - name: {{ . }}
              value: {{ $.Values.port.number | quote }}
            {{- end }}
            {{- range .Values.extraPorts }}
            {{- if .env }}
            - name: {{ .env }}
              value: {{ .number | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.postgres.enabled }}
            {{- $pg := ternary .Values.postgres.external .Values.postgres .Values.postgres.external.enabled }}
            - name: DATABASE_DSN
              value: {{ printf "postgres://%s@%s:%v/%s?sslmode=%s"
                  (required "postgres user is required when postgres.enabled" $pg.user | urlquery)
                  (required "postgres host is required when postgres.enabled" $pg.host)
                  $pg.port
                  (required "postgres database is required when postgres.enabled" $pg.database | urlquery)
                  ($pg.sslmode | urlquery) | quote }}
            {{- /* The pgx pool and the migration driver both read PGPASSWORD, so the password never goes into the URL. */}}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgres passwordSecretName is required when postgres.enabled" $pg.passwordSecretName }}
                  key: {{ $pg.passwordSecretKey }}
            {{- end }}
            {{- if .Values.workloadAuth.callee }}
            {{- if eq (include "service-chart.workloadAuthMode" .) "disabled" }}
            {{- /* Local runs only: the services reject this together with any WORKLOAD_OIDC_* setting. */}}
            - name: WORKLOAD_AUTH
              value: "disabled"
            {{- else }}
            {{- /* Enabled is WORKLOAD_AUTH unset; the services reject any other value. */}}
            - name: WORKLOAD_AUDIENCE
              value: {{ .Values.workloadAuth.audience | quote }}
            - name: WORKLOAD_OIDC_ISSUER
              value: {{ required "workloadAuth.oidc.issuer is required when workloadAuth.callee is true" .Values.workloadAuth.oidc.issuer | quote }}
            - name: WORKLOAD_OIDC_JWKS_URL
              value: {{ required "workloadAuth.oidc.jwksUrl is required when workloadAuth.callee is true" .Values.workloadAuth.oidc.jwksUrl | quote }}
            - name: WORKLOAD_OIDC_CA_FILE
              value: {{ .Values.workloadAuth.oidc.caFile | quote }}
            - name: WORKLOAD_OIDC_BEARER_FILE
              value: {{ .Values.workloadAuth.oidc.bearerFile | quote }}
            - name: WORKLOAD_ALLOWED_SERVICEACCOUNTS
              value: {{ include "service-chart.allowedServiceAccounts" . | required (printf "%s: workloadAuth.allowedServiceAccounts is required for an enabled callee" (include "service-chart.fullname" .)) | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.workloadAuth.caller }}
            - name: WORKLOAD_TOKEN_FILE
              value: {{ .Values.workloadAuth.tokenPath | quote }}
            {{- end }}
            {{- if .Values.devQuickLogin.enabled }}
            {{- if and (not .Values.devQuickLogin.configMapName) (not .Values.devQuickLogin.secretName) }}
            {{- fail (printf "%s: devQuickLogin.enabled needs configMapName or secretName" (include "service-chart.fullname" .)) }}
            {{- end }}
            {{- if and .Values.devQuickLogin.configMapName .Values.devQuickLogin.secretName }}
            {{- fail (printf "%s: devQuickLogin can't set both configMapName and secretName" (include "service-chart.fullname" .)) }}
            {{- end }}
            - name: STEWARD_DEV_QUICK_LOGIN
              value: "true"
            - name: STEWARD_DEV_QUICK_LOGIN_USERS
              value: {{ printf "/var/run/secrets/steward-dev-quick-login/%s" .Values.devQuickLogin.key | quote }}
            {{- end }}
            {{- $overridden := list }}
            {{- range .Values.env }}
            {{- $overridden = append $overridden .name }}
            {{- end }}
            {{- range (include "service-chart.callAddresses" . | fromJsonArray) }}
            {{- if not (has .name $overridden) }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- end }}
            {{- range .Values.baseEnv }}
            {{- if not (has .name $overridden) }}
            - name: {{ .name }}
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name }}
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $jwksCreds := include "service-chart.jwksCredentials" . }}
          {{- $identity := or .Values.workloadAuth.caller $jwksCreds }}
          {{- if or $identity .Values.devQuickLogin.enabled }}
          volumeMounts:
            {{- if $identity }}
            - name: workload-identity
              mountPath: /var/run/secrets/steward
              readOnly: true
            {{- end }}
            {{- if .Values.devQuickLogin.enabled }}
            - name: dev-quick-login
              mountPath: /var/run/secrets/steward-dev-quick-login
              readOnly: true
            {{- end }}
          {{- end }}
      {{- $jwksCreds := include "service-chart.jwksCredentials" . }}
      {{- $identity := or .Values.workloadAuth.caller $jwksCreds }}
      {{- if or $identity .Values.devQuickLogin.enabled }}
      volumes:
        {{- if $identity }}
        - name: workload-identity
          projected:
            sources:
              {{- if .Values.workloadAuth.caller }}
              # The caller token, presented to other Steward services.
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.workloadAuth.audience }}
                  expirationSeconds: 3600
              {{- end }}
              {{- if $jwksCreds }}
              # The JWKS fetch credentials: the API server rejects the
              # steward-audience token, so a second token with no audience
              # (the API server's own default) authenticates the fetch, and
              # the namespace's kube-root-ca.crt verifies the API server
              # without automounting the service-account token.
              - serviceAccountToken:
                  path: jwks/token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: kube-ca/ca.crt
              {{- end }}
        {{- end }}
        {{- if .Values.devQuickLogin.enabled }}
        - name: dev-quick-login
          {{- if .Values.devQuickLogin.configMapName }}
          configMap:
            name: {{ .Values.devQuickLogin.configMapName }}
          {{- else }}
          secret:
            secretName: {{ .Values.devQuickLogin.secretName }}
          {{- end }}
        {{- end }}
      {{- end }}
