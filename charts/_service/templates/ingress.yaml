{{/*
An optional Ingress to the alias's main port, for the apps a browser reaches
(the web apps). Off by default; namespaced, using the cluster's ingress
controller and its IngressClass (or the cluster default when className is
empty). TLS Secrets are the operator's, by name.
*/}}
{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.hosts }}
{{- fail (printf "%s: ingress.enabled needs at least one ingress.hosts entry" (include "service-chart.fullname" .)) }}
{{- end }}
{{- /*
edgeHeader marks every request this Ingress forwards with X-Steward-Edge:
public, the header gateway's MFA_ENFORCE=edge (its own default) needs to ask
a signed-in user for a second factor. Assumes an ingress-nginx controller; an
operator's own annotation of the same name always wins, and edgeHeader: false
turns this off for a different controller's own equivalent.
*/}}
{{- $autoAnnotations := dict }}
{{- if .Values.ingress.edgeHeader }}
{{- $autoAnnotations = dict "nginx.ingress.kubernetes.io/configuration-snippet" "proxy_set_header X-Steward-Edge \"public\";\n" }}
{{- end }}
{{- $annotations := merge (deepCopy (.Values.ingress.annotations | default dict)) $autoAnnotations }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "service-chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-chart.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "service-chart.fullname" $ }}
                port:
                  number: {{ $.Values.port.number }}
          {{- end }}
    {{- end }}
{{- end }}
