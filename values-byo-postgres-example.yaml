# Bring-your-own Postgres: disable every Bugs5382/helm-postgres-ha instance and
# point each service at your own database and credentials Secret instead. Layer
# this on top of values.yaml:
#
#   helm install steward . -f values.yaml -f values-byo-postgres-example.yaml \
#     --namespace steward --create-namespace
#
# Create each passwordSecretName below before installing (see docs/install.md).

identity-postgres:
  enabled: false

identity:
  postgres:
    external:
      enabled: true
      host: your-postgres-host.example.org
      database: identity
      user: steward_identity
      passwordSecretName: steward-identity-postgres-external

core-postgres:
  enabled: false

core:
  postgres:
    external:
      enabled: true
      host: your-postgres-host.example.org
      database: core
      user: steward_core
      passwordSecretName: steward-core-postgres-external

